<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TaskNavigator</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── DARK THEME ── */
:root, [data-theme="dark"] {
  --body-bg: #111110;
  --phone-bg: #0f0e0c;
  --bg2: #181712;
  --bg3: #252318;
  --bg4: #1e1d18;
  --bg-hover: #1e1d18;
  --border: #252318;
  --border2: #333;
  --accent: #F59E0B;
  --accent-bg: #2e1f00;
  --blue: #60a5fa;
  --blue-bg: #162033;
  --green: #4ade80;
  --green-bg: #14290a;
  --orange: #fb923c;
  --orange-bg: #1f1206;
  --red: #f87171;
  --text: #fff;
  --text2: #e5e7eb;
  --text3: #9ca3af;
  --text4: #6b7280;
  --text5: #4b5563;
  --nav-border: #1c1b18;
  --ring-track: #252318;
  --sheet-bg: #181712;
  --summary-note-bg: #1e1d18;
  --summary-step-bg: #1c1a10;
  --summary-link-bg: #101820;
  --phone-shadow: 0 40px 100px rgba(0,0,0,0.6), 0 0 0 1px #1e1d18, inset 0 0 0 1px #2a2820;
  --toggle-bg: #252318;
  --toggle-icon: "🌙";
}
/* ── LIGHT THEME ── */
[data-theme="light"] {
  --body-bg: #f0ede8;
  --phone-bg: #faf9f7;
  --bg2: #ffffff;
  --bg3: #f1ede6;
  --bg4: #e8e2d9;
  --bg-hover: #f5f1eb;
  --border: #e8e2d9;
  --border2: #d4cec5;
  --accent: #d97706;
  --accent-bg: #fef3c7;
  --blue: #2563eb;
  --blue-bg: #dbeafe;
  --green: #16a34a;
  --green-bg: #dcfce7;
  --orange: #ea580c;
  --orange-bg: #ffedd5;
  --red: #dc2626;
  --text: #1c1917;
  --text2: #292524;
  --text3: #57534e;
  --text4: #78716c;
  --text5: #a8a29e;
  --nav-border: #e8e2d9;
  --ring-track: #e8e2d9;
  --sheet-bg: #ffffff;
  --summary-note-bg: #fef9f0;
  --summary-step-bg: #fffbeb;
  --summary-link-bg: #eff6ff;
  --phone-shadow: 0 40px 100px rgba(0,0,0,0.13), 0 0 0 1px #d4cec5, inset 0 0 0 1px #e8e2d9;
  --toggle-bg: #fff;
}

body {
  background: var(--body-bg);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 24px 16px 40px;
  transition: background 0.3s;
}

/* ── Theme Toggle ── */
#themeToggle {
  position: fixed; top: 18px; right: 18px; z-index: 999;
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border2); cursor: pointer;
  background: var(--toggle-bg); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 12px rgba(0,0,0,0.18); transition: all 0.2s; font-size: 18px; line-height:1;
}
#themeToggle:hover { transform: scale(1.08); }

/* ── Phone ── */
#phone {
  width: 390px; max-width: 100%; height: 820px;
  background: var(--phone-bg); border-radius: 50px; overflow: hidden; position: relative;
  display: flex; flex-direction: column;
  box-shadow: var(--phone-shadow);
  transition: background 0.3s, box-shadow 0.3s;
}
.notch { display: flex; justify-content: center; padding-top: 12px; flex-shrink: 0; }
.notch-inner {
  width: 110px; height: 30px; background: var(--phone-bg); border: 1px solid var(--bg4);
  border-radius: 0 0 18px 18px; display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background 0.3s, border-color 0.3s;
}
.notch-dot { width:8px; height:8px; border-radius:50%; background:var(--bg3); }
.notch-cam { width:10px; height:10px; border-radius:50%; background:var(--bg4); }
.status-bar { padding:2px 28px 10px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
.status-time { font-size:13px; font-weight:700; color:var(--text); font-family:'Syne',sans-serif; }
.status-icons { display:flex; gap:5px; align-items:center; }
#content { flex:1; display:flex; flex-direction:column; overflow:hidden; }

/* ── Bottom Nav ── */
.bottom-nav { flex-shrink:0; background:var(--phone-bg); border-top:1px solid var(--nav-border); padding:10px 0 0; transition:background 0.3s, border-color 0.3s; }
.nav-tabs { display:flex; }
.nav-tab {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  background:transparent; border:none; cursor:pointer; color:var(--text5);
  padding:8px 0; font-family:'DM Sans',sans-serif; transition:color 0.2s;
}
.nav-tab.active { color:var(--accent); }
.nav-tab span { font-size:10px; font-weight:700; letter-spacing:0.3px; }
.home-indicator { display:flex; justify-content:center; padding:10px 0 16px; }
.home-bar { width:120px; height:4px; border-radius:2px; background:var(--bg3); transition:background 0.3s; }

/* ── Screens ── */
.screen { flex:1; overflow-y:auto; padding-bottom:20px; }
.screen-header { padding:16px 20px 0; display:flex; justify-content:space-between; align-items:center; }
.screen-title { font-size:24px; font-weight:800; color:var(--text); font-family:'Syne',sans-serif; }
.section-label { margin:18px 20px 8px; font-size:11px; font-weight:700; color:var(--text4); text-transform:uppercase; letter-spacing:0.8px; display:block; }

/* ── Buttons ── */
.btn-add { width:36px; height:36px; border-radius:10px; border:none; background:var(--accent); cursor:pointer; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; transition:opacity 0.15s; }
.btn-add:hover { opacity:0.85; }
.btn-primary { width:100%; padding:13px; border-radius:12px; border:none; background:var(--accent); color:#fff; font-weight:700; font-size:14px; cursor:pointer; font-family:'DM Sans',sans-serif; transition:opacity 0.15s; }
.btn-primary:hover { opacity:0.9; }
.btn-del { background:transparent; border:none; cursor:pointer; color:var(--text5); flex-shrink:0; padding:4px; display:flex; align-items:center; transition:color 0.2s; }
.btn-del:hover { color:var(--red); }
.btn-back { background:transparent; border:none; cursor:pointer; color:var(--text3); padding:4px; display:flex; flex-shrink:0; }

/* ── Cards ── */
.card { background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:14px 16px; transition:background 0.3s, border-color 0.3s; }
.card-list { padding:0 16px; display:flex; flex-direction:column; gap:8px; }
.card-row { display:flex; align-items:center; gap:13px; cursor:pointer; transition:background 0.15s; }
.card-row:hover { background:var(--bg-hover); }

/* ── Pills ── */
.pill-done { font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; background:var(--green-bg); color:var(--green); letter-spacing:0.3px; }
.pill-active { font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; background:var(--accent-bg); color:var(--accent); letter-spacing:0.3px; }
.pill-new { font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; background:var(--bg3); color:var(--text4); letter-spacing:0.3px; }

/* ── Inputs ── */
.inp { width:100%; background:var(--bg3); border:1px solid var(--border2); border-radius:10px; padding:11px 14px; color:var(--text); font-size:14px; outline:none; font-family:'DM Sans',sans-serif; margin-bottom:8px; transition:border-color 0.2s, background 0.3s; }
.inp:focus { border-color:var(--accent); }
.inp::placeholder { color:var(--text4); }
textarea.inp { resize:vertical; min-height:80px; }

/* ── Progress ── */
.progress-track { height:3px; background:var(--bg3); border-radius:2px; }
.progress-fill { height:100%; background:var(--accent); border-radius:2px; transition:width 0.4s ease; }
input[type=range] { width:100%; accent-color:var(--accent); }

/* ── Empty State ── */
.empty-state { margin:16px; padding:28px 20px; background:var(--bg2); border:1px dashed var(--border2); border-radius:16px; text-align:center; }
.empty-state p:first-child { color:var(--text3); font-size:14px; margin-bottom:5px; }
.empty-state p:last-child { color:var(--text4); font-size:12px; }

/* ── Bottom Sheet ── */
.sheet-backdrop { position:absolute; inset:0; z-index:80; display:flex; flex-direction:column; justify-content:flex-end; pointer-events:none; opacity:0; transition:opacity 0.25s; }
.sheet-backdrop.open { pointer-events:all; opacity:1; }
.sheet-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.55); }
.sheet-panel { position:relative; background:var(--sheet-bg); border-radius:22px 22px 0 0; max-height:82%; display:flex; flex-direction:column; transform:translateY(100%); transition:transform 0.3s cubic-bezier(0.32,0.72,0,1); }
.sheet-backdrop.open .sheet-panel { transform:translateY(0); }
.sheet-handle { width:36px; height:4px; border-radius:2px; background:var(--border2); margin:12px auto 0; }
.sheet-header { padding:14px 20px 10px; border-bottom:1px solid var(--border); }
.sheet-header p { font-weight:700; font-size:16px; color:var(--text); }
.sheet-body { overflow-y:auto; padding:16px 20px 28px; }

/* ── Task Detail Tabs ── */
.tab-bar { display:flex; gap:5px; margin-bottom:2px; overflow-x:auto; padding-bottom:2px; }
.tab-bar::-webkit-scrollbar { display:none; }
.tab-btn { flex:1; min-width:fit-content; padding:7px 6px; border-radius:10px; border:1px solid var(--border); background:transparent; cursor:pointer; color:var(--text4); font-size:11px; font-weight:700; font-family:'DM Sans',sans-serif; white-space:nowrap; transition:all 0.15s; }
.tab-btn.active { border-color:var(--accent); background:var(--accent-bg); color:var(--accent); }

/* ── Date divider ── */
.date-divider { display:flex; align-items:center; gap:10px; margin:14px 16px 8px; }
.date-line { flex:1; height:1px; background:var(--border); }
.date-label { font-size:11px; color:var(--text4); white-space:nowrap; }

/* ── Step num ── */
.step-num { min-width:28px; height:28px; border-radius:50%; background:var(--accent-bg); border:1.5px solid var(--accent); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:var(--accent); flex-shrink:0; }

/* ── Link icon ── */
.link-icon-wrap { width:34px; height:34px; border-radius:10px; background:var(--blue-bg); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--blue); }
a.res-link { display:block; font-weight:700; font-size:14px; color:var(--blue); text-decoration:none; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
a.res-link:hover { text-decoration:underline; }

/* ── Stats grid ── */
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:20px; }
.stat-card { border-radius:14px; padding:13px 15px; }
.stat-val { font-size:24px; font-weight:800; font-family:'Syne',sans-serif; margin-bottom:2px; }
.stat-label { font-size:11px; color:var(--text3); }

/* ── Tasks tab sections ── */
.tasks-section-hdr { display:flex; align-items:center; gap:8px; padding:14px 20px 8px; }
.tasks-section-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.7px; }
.tasks-count-badge { font-size:11px; font-weight:700; padding:2px 7px; border-radius:20px; }

/* ── Subcategory label ── */
.subcat-label { font-size:10px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:3px; }

/* ── Breadcrumb ── */
.breadcrumb { font-size:11px; color:var(--text4); display:flex; align-items:center; gap:4px; flex-wrap:wrap; padding-bottom:8px; }
.bc-sep { color:var(--text5); }

/* ── Summary ── */
.summary-section { margin:10px 16px 0; }
.summary-section-title {
  font-size:11px; font-weight:700; color:var(--text4); text-transform:uppercase; letter-spacing:0.7px;
  margin-bottom:8px; display:flex; align-items:center; gap:8px;
}
.summary-section-title::after { content:''; flex:1; height:1px; background:var(--border); }
.summary-note-item { background:var(--summary-note-bg); border-radius:10px; padding:10px 12px; margin-bottom:6px; border-left:3px solid var(--accent); }
.summary-step-item { background:var(--summary-step-bg); border-radius:10px; padding:10px 12px; margin-bottom:6px; display:flex; gap:10px; align-items:flex-start; }
.summary-link-item { background:var(--summary-link-bg); border-radius:10px; padding:10px 12px; margin-bottom:6px; display:flex; gap:10px; align-items:center; }

.mono { font-family:'Courier New',monospace; }

::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
</style>
</head>
<body>

<button id="themeToggle" onclick="toggleTheme()" title="Toggle dark/light mode">🌙</button>

<div id="phone">
  <div class="notch">
    <div class="notch-inner"><div class="notch-dot"></div><div class="notch-cam"></div></div>
  </div>
  <div class="status-bar">
    <span class="status-time" id="statusTime"></span>
    <div class="status-icons">
      <svg width="14" height="10" viewBox="0 0 14 10" fill="var(--text)" opacity="0.9"><rect x="0" y="2.5" width="2.5" height="7.5" rx="0.8"/><rect x="3.8" y="1.5" width="2.5" height="8.5" rx="0.8"/><rect x="7.6" y="0.5" width="2.5" height="9.5" rx="0.8"/><rect x="11.4" y="0" width="2.5" height="10" rx="0.8"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none" opacity="0.9"><rect x="0.5" y="0.5" width="13" height="10" rx="2" stroke="var(--text)" stroke-opacity="0.5"/><rect x="14" y="3" width="1.5" height="5" rx="0.75" fill="var(--text)" fill-opacity="0.4"/><rect x="1.5" y="1.5" width="9.5" height="8" rx="1.2" fill="var(--text)"/></svg>
    </div>
  </div>
  <div id="content"></div>
  <div class="bottom-nav">
    <div class="nav-tabs">
      <button class="nav-tab" id="tab-dashboard" onclick="setBottomTab('dashboard')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-tab" id="tab-tasks" onclick="setBottomTab('tasks')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="6" height="6" rx="1"/><rect x="3" y="13" width="6" height="6" rx="1"/><line x1="13" y1="8" x2="21" y2="8"/><line x1="13" y1="16" x2="21" y2="16"/></svg>
        <span>Tasks</span>
      </button>
      <button class="nav-tab" id="tab-cats" onclick="setBottomTab('cats')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Categories</span>
      </button>
    </div>
    <div class="home-indicator"><div class="home-bar"></div></div>
  </div>

  <!-- Sheet: New Category -->
  <div class="sheet-backdrop" id="catSheet">
    <div class="sheet-overlay" onclick="closeCatSheet()"></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-header"><p>New Category</p></div>
      <div class="sheet-body">
        <p style="margin:0 0 12px;font-size:13px;color:var(--text3)">E.g. Education, Health, Business</p>
        <input class="inp" id="catInput" placeholder="Category name..." onkeydown="if(event.key==='Enter')addCat()"/>
        <button class="btn-primary" onclick="addCat()">Create Category</button>
      </div>
    </div>
  </div>

  <!-- Sheet: New Subcategory -->
  <div class="sheet-backdrop" id="subcatSheet">
    <div class="sheet-overlay" onclick="closeSubcatSheet()"></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-header"><p>New Subcategory</p></div>
      <div class="sheet-body">
        <p id="subcatSheetSub" style="margin:0 0 12px;font-size:13px;color:var(--text3)"></p>
        <input class="inp" id="subcatInput" placeholder="Subcategory name..." onkeydown="if(event.key==='Enter')addSubcat()"/>
        <button class="btn-primary" onclick="addSubcat()">Create Subcategory</button>
      </div>
    </div>
  </div>

  <!-- Sheet: New Task -->
  <div class="sheet-backdrop" id="taskSheet">
    <div class="sheet-overlay" onclick="closeTaskSheet()"></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-header"><p>New Task</p></div>
      <div class="sheet-body">
        <p id="taskSheetSub" style="margin:0 0 12px;font-size:13px;color:var(--text3)"></p>
        <input class="inp" id="taskInput" placeholder="Task name..." onkeydown="if(event.key==='Enter')addTask()"/>
        <button class="btn-primary" onclick="addTask()">Create Task</button>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════
//  STATE
// ═══════════════════════════════════
const KEY = 'task_nav_v4';
const EMPTY = {categories:[],subcategories:[],tasks:[],research:[],steps:[],resources:[]};
let data = JSON.parse(JSON.stringify(EMPTY));
let isDark = true;
let bottomTab = 'dashboard';
let screen = 'cats';   // cats | subcats | tasklist | task
let selCatId = null;
let selSubcatId = null;
let selTaskId = null;
let taskDetailTab = 'summary';

// ═══════════════════════════════════
//  THEME
// ═══════════════════════════════════
function toggleTheme(){
  isDark = !isDark;
  document.documentElement.setAttribute('data-theme', isDark?'dark':'light');
  document.getElementById('themeToggle').textContent = isDark?'🌙':'☀️';
  try{ localStorage.setItem('tn_theme', isDark?'dark':'light'); }catch(e){}
}
function loadTheme(){
  try{
    const t = localStorage.getItem('tn_theme');
    if(t==='light'){ isDark=false; document.documentElement.setAttribute('data-theme','light'); document.getElementById('themeToggle').textContent='☀️'; }
  }catch(e){}
}

// ═══════════════════════════════════
//  PERSISTENCE
// ═══════════════════════════════════
function load(){
  try{ const s=localStorage.getItem(KEY); if(s){ const p=JSON.parse(s); data={...EMPTY,...p}; } }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){} }
function persist(d){ data=d; save(); render(); }

// ═══════════════════════════════════
//  HELPERS
// ═══════════════════════════════════
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmtDate(iso){ return new Date(iso).toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short'}); }
function fmtTime(iso){ return new Date(iso).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }
function daysSince(iso){ return Math.max(1,Math.ceil((Date.now()-new Date(iso))/86400000)); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function statusPill(p){
  if(p===100) return `<span class="pill-done">DONE</span>`;
  if(p>0) return `<span class="pill-active">ACTIVE</span>`;
  return `<span class="pill-new">NEW</span>`;
}

function ring(pct,size=48){
  const sw=4,r=(size/2)-sw-1,cx=size/2,cy=size/2;
  const circ=2*Math.PI*r,dash=(pct/100)*circ;
  const col = pct===100?'var(--green)':pct>0?'var(--accent)':'var(--text5)';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--ring-track)" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}"
      stroke-dasharray="${dash} ${circ-dash}" stroke-linecap="round"
      transform="rotate(-90 ${cx} ${cy})" style="transition:stroke-dasharray 0.4s ease"/>
    <text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="${size<50?'10':'12'}" font-weight="700" fill="var(--text)">${pct}%</text>
  </svg>`;
}

function groupByDate(items){
  const g={};
  [...items].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)).forEach(item=>{
    const d=new Date(item.timestamp).toDateString();
    if(!g[d])g[d]=[];
    g[d].push(item);
  });
  return Object.entries(g);
}

const TRASH = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>`;
const BACK  = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`;

// ═══════════════════════════════════
//  CRUD
// ═══════════════════════════════════
function addCat(){
  const v=document.getElementById('catInput').value.trim(); if(!v)return;
  persist({...data,categories:[...data.categories,{id:uid(),name:v,createdAt:new Date().toISOString()}]});
  document.getElementById('catInput').value=''; closeCatSheet();
}
function delCat(cid){
  const sids=data.subcategories.filter(s=>s.categoryId===cid).map(s=>s.id);
  const tids=data.tasks.filter(t=>sids.includes(t.subcategoryId)).map(t=>t.id);
  persist({...data,
    categories:data.categories.filter(c=>c.id!==cid),
    subcategories:data.subcategories.filter(s=>s.categoryId!==cid),
    tasks:data.tasks.filter(t=>!tids.includes(t.id)),
    research:data.research.filter(r=>!tids.includes(r.taskId)),
    steps:data.steps.filter(s=>!tids.includes(s.taskId)),
    resources:data.resources.filter(r=>!tids.includes(r.taskId))
  });
}
function addSubcat(){
  const v=document.getElementById('subcatInput').value.trim(); if(!v)return;
  persist({...data,subcategories:[...data.subcategories,{id:uid(),categoryId:selCatId,name:v,createdAt:new Date().toISOString()}]});
  document.getElementById('subcatInput').value=''; closeSubcatSheet();
}
function delSubcat(sid){
  const tids=data.tasks.filter(t=>t.subcategoryId===sid).map(t=>t.id);
  persist({...data,
    subcategories:data.subcategories.filter(s=>s.id!==sid),
    tasks:data.tasks.filter(t=>t.subcategoryId!==sid),
    research:data.research.filter(r=>!tids.includes(r.taskId)),
    steps:data.steps.filter(s=>!tids.includes(s.taskId)),
    resources:data.resources.filter(r=>!tids.includes(r.taskId))
  });
}
function addTask(){
  const v=document.getElementById('taskInput').value.trim(); if(!v)return;
  const now=new Date().toISOString();
  persist({...data,tasks:[...data.tasks,{id:uid(),subcategoryId:selSubcatId,name:v,progress:0,createdAt:now,updatedAt:now}]});
  document.getElementById('taskInput').value=''; closeTaskSheet();
}
function delTask(tid){
  persist({...data,
    tasks:data.tasks.filter(t=>t.id!==tid),
    research:data.research.filter(r=>r.taskId!==tid),
    steps:data.steps.filter(s=>s.taskId!==tid),
    resources:data.resources.filter(r=>r.taskId!==tid)
  });
}
function setProgress(tid,p){
  persist({...data,tasks:data.tasks.map(t=>t.id===tid?{...t,progress:p,updatedAt:new Date().toISOString()}:t)});
}
function addResearch(){
  const v=document.getElementById('resNote').value.trim(); if(!v)return;
  persist({...data,research:[...data.research,{id:uid(),taskId:selTaskId,content:v,timestamp:new Date().toISOString()}]});
  document.getElementById('resNote').value='';
}
function delResearch(rid){ persist({...data,research:data.research.filter(r=>r.id!==rid)}); }
function addStep(){
  const v=document.getElementById('stepNote').value.trim(); if(!v)return;
  const n=data.steps.filter(s=>s.taskId===selTaskId).length;
  persist({...data,steps:[...data.steps,{id:uid(),taskId:selTaskId,content:v,order:n+1,timestamp:new Date().toISOString()}]});
  document.getElementById('stepNote').value='';
}
function delStep(sid){
  const others=data.steps.filter(s=>s.taskId!==selTaskId);
  const reordered=data.steps.filter(s=>s.taskId===selTaskId&&s.id!==sid).map((s,i)=>({...s,order:i+1}));
  persist({...data,steps:[...others,...reordered]});
}
function addResource(){
  const name=document.getElementById('rName').value.trim();
  const url=document.getElementById('rUrl').value.trim();
  const desc=document.getElementById('rDesc').value.trim();
  if(!name||!url)return;
  let u=url; if(!u.startsWith('http'))u='https://'+u;
  persist({...data,resources:[...data.resources,{id:uid(),taskId:selTaskId,name,url:u,description:desc,timestamp:new Date().toISOString()}]});
  document.getElementById('rName').value='';
  document.getElementById('rUrl').value='';
  document.getElementById('rDesc').value='';
}
function delResource(rid){ persist({...data,resources:data.resources.filter(r=>r.id!==rid)}); }

// ═══════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════
function setBottomTab(tab){
  bottomTab=tab;
  if(tab==='cats'){ screen='cats'; selCatId=null; selSubcatId=null; }
  render();
}
function openCat(cid){ selCatId=cid; screen='subcats'; render(); }
function openSubcat(sid){ selSubcatId=sid; screen='tasklist'; render(); }
function openTaskFromList(tid){ selTaskId=tid; screen='task'; taskDetailTab='summary'; render(); }
function openTaskFromDash(tid){
  const t=data.tasks.find(x=>x.id===tid); if(!t)return;
  selSubcatId=t.subcategoryId;
  const sub=data.subcategories.find(s=>s.id===selSubcatId);
  if(sub) selCatId=sub.categoryId;
  selTaskId=tid; screen='task'; taskDetailTab='summary'; bottomTab='cats'; render();
}
function goBack(){
  if(screen==='task'){ screen='tasklist'; render(); }
  else if(screen==='tasklist'){ screen='subcats'; selSubcatId=null; render(); }
  else if(screen==='subcats'){ screen='cats'; selCatId=null; render(); }
}
function setDetailTab(tab){ taskDetailTab=tab; render(); }

function openCatSheet(){ document.getElementById('catSheet').classList.add('open'); setTimeout(()=>document.getElementById('catInput').focus(),320); }
function closeCatSheet(){ document.getElementById('catSheet').classList.remove('open'); }
function openSubcatSheet(){

  document.getElementById('subcatSheet').classList.add('open');
  setTimeout(()=>document.getElementById('subcatInput').focus(),320);
}
function closeSubcatSheet(){ document.getElementById('subcatSheet').classList.remove('open'); }
function openTaskSheet(){

  document.getElementById('taskSheetSub').innerHTML=`Inside subcategory <strong style="color:var(--text)">${esc(sub?.name||'')}</strong>`;
  document.getElementById('taskSheet').classList.add('open');

}
function closeTaskSheet(){ document.getElementById('taskSheet').classList.remove('open'); }

// ═══════════════════════════════════
//  RENDER
// ═══════════════════════════════════
function render(){
  document.querySelectorAll('.nav-tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+bottomTab)?.classList.add('active');
  const content=document.getElementById('content');
  if(bottomTab==='dashboard') content.innerHTML=renderDashboard();
  else if(bottomTab==='tasks') content.innerHTML=renderTasksTab();
  else {
    if(screen==='cats'||!selCatId) content.innerHTML=renderCategories();
    else if(screen==='subcats'){ const cat=data.categories.find(c=>c.id===selCatId); content.innerHTML=cat?renderSubcategories(cat):''; }
    else if(screen==='tasklist'){ const sub=data.subcategories.find(s=>s.id===selSubcatId); content.innerHTML=sub?renderTaskList(sub):''; }
    else if(screen==='task'){ const task=data.tasks.find(t=>t.id===selTaskId); content.innerHTML=task?renderTaskDetail(task):''; }
  }
}

// ── DASHBOARD ──
function renderDashboard(){
  const tasks=data.tasks;
  const total=tasks.length;
  const done=tasks.filter(t=>t.progress===100).length;
  const active=tasks.filter(t=>t.progress>0&&t.progress<100).length;
  const stats=[
    [total,'Total Tasks','var(--blue-bg)','var(--blue)'],
    [done,'Done','var(--green-bg)','var(--green)'],
    [active,'Active','var(--orange-bg)','var(--orange)'],
    [data.categories.length,'Categories','var(--accent-bg)','var(--accent)']
  ];
  let html=`<div class="screen">
    <div style="padding:16px 20px 0">
      <p style="margin:0 0 1px;font-size:12px;color:var(--text4)">Welcome back</p>
      <h1 style="margin:0 0 16px;font-size:24px;font-weight:800;color:var(--text);letter-spacing:-0.5px;font-family:'Syne',sans-serif">Dashboard</h1>
      <div class="stats-grid">
        ${stats.map(([v,l,bg,cl])=>`<div class="stat-card" style="background:${bg}"><div class="stat-val" style="color:${cl}">${v}</div><div class="stat-label">${l}</div></div>`).join('')}
      </div>
    </div>`;
  data.categories.forEach(cat=>{
    const subs=data.subcategories.filter(s=>s.categoryId===cat.id);
    const ctasks=tasks.filter(t=>subs.some(s=>s.id===t.subcategoryId));
    if(!ctasks.length)return;
    html+=`<span class="section-label">${esc(cat.name)}</span><div class="card-list">`;
    ctasks.forEach(t=>{
      html+=`<div class="card card-row" onclick="openTaskFromDash('${t.id}')">
        ${ring(t.progress,46)}
        <div style="flex:1;min-width:0">
          <p style="margin:0 0 4px;font-weight:600;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.name)}</p>
          <div style="display:flex;gap:8px;align-items:center">${statusPill(t.progress)}<span style="font-size:11px;color:var(--text4)">${daysSince(t.createdAt)}d</span></div>
        </div>${CHEV}
      </div>`;
    });
    html+=`</div>`;
  });
  if(!tasks.length) html+=`<div class="empty-state"><p>No tasks yet</p><p>Go to Categories to begin</p></div>`;
  return html+`</div>`;
}

// ── TASKS TAB ──
function renderTasksTab(){
  const activeTasks=data.tasks.filter(t=>t.progress>0&&t.progress<100);
  const doneTasks=data.tasks.filter(t=>t.progress===100);
  function taskCard(t){
    const sub=data.subcategories.find(s=>s.id===t.subcategoryId);
    const cat=sub?data.categories.find(c=>c.id===sub.categoryId):null;
    return `<div class="card card-row" onclick="openTaskFromDash('${t.id}')">
      ${ring(t.progress,46)}
      <div style="flex:1;min-width:0">
        <p style="margin:0 0 4px;font-weight:600;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.name)}</p>
        <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">
          ${statusPill(t.progress)}
          ${cat?`<span style="font-size:10px;color:var(--text4);background:var(--bg3);padding:2px 6px;border-radius:6px">${esc(cat.name)}</span>`:''}
          ${sub?`<span style="font-size:10px;color:var(--accent);background:var(--accent-bg);padding:2px 6px;border-radius:6px">${esc(sub.name)}</span>`:''}
        </div>
      </div>${CHEV}
    </div>`;
  }
  let html=`<div class="screen">
    <div style="padding:16px 20px 0">
      <p style="margin:0 0 1px;font-size:12px;color:var(--text4)">All tasks</p>
      <h1 style="margin:0;font-size:24px;font-weight:800;color:var(--text);font-family:'Syne',sans-serif">Tasks</h1>
    </div>
    <div class="tasks-section-hdr">
      <span class="tasks-count-badge" style="background:var(--accent-bg);color:var(--accent)">${activeTasks.length}</span>
      <span class="tasks-section-title" style="color:var(--accent)">Active</span>
    </div>`;
  if(!activeTasks.length) html+=`<div class="empty-state" style="margin:0 16px 4px"><p>No active tasks</p><p>Tasks with partial progress appear here</p></div>`;
  else html+=`<div class="card-list">${activeTasks.map(taskCard).join('')}</div>`;
  html+=`<div class="tasks-section-hdr" style="margin-top:4px">
    <span class="tasks-count-badge" style="background:var(--green-bg);color:var(--green)">${doneTasks.length}</span>
    <span class="tasks-section-title" style="color:var(--green)">Completed</span>
  </div>`;
  if(!doneTasks.length) html+=`<div class="empty-state" style="margin:0 16px 4px"><p>No completed tasks</p><p>Tasks at 100% appear here</p></div>`;
  else html+=`<div class="card-list">${doneTasks.map(taskCard).join('')}</div>`;
  return html+`</div>`;
}

// ── CATEGORIES ──
function renderCategories(){
  let html=`<div class="screen"><div class="screen-header"><h1 class="screen-title">Categories</h1><button class="btn-add" onclick="openCatSheet()">${PLUS}</button></div>
    <span class="section-label">${data.categories.length} total</span>`;
  if(!data.categories.length) html+=`<div class="empty-state" style="margin:0 16px"><p>No categories yet</p><p>Tap + to create your first one</p></div>`;
  html+=`<div class="card-list">`;
  data.categories.forEach(cat=>{
    const subs=data.subcategories.filter(s=>s.categoryId===cat.id);
    const ctasks=data.tasks.filter(t=>subs.some(s=>s.id===t.subcategoryId));
    const avg=ctasks.length?Math.round(ctasks.reduce((s,t)=>s+t.progress,0)/ctasks.length):0;
    html+=`<div class="card" onclick="openCat('${cat.id}')" style="cursor:pointer">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="flex:1;min-width:0">
          <p style="margin:0 0 2px;font-weight:700;font-size:15px;color:var(--text)">${esc(cat.name)}</p>
          <p style="margin:0;font-size:12px;color:var(--text4)">${subs.length} subcategor${subs.length!==1?'ies':'y'} · ${ctasks.length} task${ctasks.length!==1?'s':''}</p>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:13px;font-weight:700;color:var(--accent)">${avg}%</span>
          <button class="btn-del" onclick="event.stopPropagation();delCat('${cat.id}')">${TRASH}</button>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${avg}%"></div></div>
    </div>`;
  });
  return html+`</div></div>`;
}

// ── SUBCATEGORIES ──
function renderSubcategories(cat){
  const subs=data.subcategories.filter(s=>s.categoryId===cat.id);
  let html=`<div class="screen">
    <div class="screen-header">
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn-back" onclick="goBack()">${BACK}</button>
        <div>
          <p style="margin:0;font-size:11px;color:var(--text4);text-transform:uppercase;letter-spacing:0.5px">Category</p>
          <h1 style="margin:0;font-size:19px;font-weight:800;color:var(--text);font-family:'Syne',sans-serif">${esc(cat.name)}</h1>
        </div>
      </div>
      <button class="btn-add" onclick="openSubcatSheet()">${PLUS}</button>
    </div>
    <span class="section-label">${subs.length} Subcategor${subs.length!==1?'ies':'y'}</span>`;
  if(!subs.length) html+=`<div class="empty-state" style="margin:0 16px"><p>No subcategories yet</p><p>Tap + to add one</p></div>`;
  html+=`<div class="card-list">`;
  subs.forEach(sub=>{
    const stasks=data.tasks.filter(t=>t.subcategoryId===sub.id);
    const avg=stasks.length?Math.round(stasks.reduce((s,t)=>s+t.progress,0)/stasks.length):0;
    const done=stasks.filter(t=>t.progress===100).length;
    html+=`<div class="card" onclick="openSubcat('${sub.id}')" style="cursor:pointer">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="flex:1;min-width:0">
          <div class="subcat-label">Subcategory</div>
          <p style="margin:0 0 2px;font-weight:700;font-size:15px;color:var(--text)">${esc(sub.name)}</p>
          <p style="margin:0;font-size:12px;color:var(--text4)">${stasks.length} task${stasks.length!==1?'s':''} · ${done} done</p>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          ${ring(avg,44)}
          <button class="btn-del" onclick="event.stopPropagation();delSubcat('${sub.id}')">${TRASH}</button>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${avg}%"></div></div>
    </div>`;
  });
  return html+`</div></div>`;
}

// ── TASK LIST ──
function renderTaskList(sub){
  const tasks=data.tasks.filter(t=>t.subcategoryId===sub.id);
  const cat=data.categories.find(c=>c.id===sub.categoryId);
  let html=`<div class="screen">
    <div class="screen-header">
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn-back" onclick="goBack()">${BACK}</button>
        <div>
          <p style="margin:0;font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:0.5px">${esc(cat?.name||'')}</p>
          <h1 style="margin:0;font-size:19px;font-weight:800;color:var(--text);font-family:'Syne',sans-serif">${esc(sub.name)}</h1>
        </div>
      </div>
      <button class="btn-add" onclick="openTaskSheet()">${PLUS}</button>
    </div>
    <span class="section-label">${tasks.length} Task${tasks.length!==1?'s':''}</span>`;
  if(!tasks.length) html+=`<div class="empty-state" style="margin:0 16px"><p>No tasks yet</p><p>Tap + to add your first task</p></div>`;
  html+=`<div class="card-list">`;
  tasks.forEach(t=>{
    const rc=data.research.filter(r=>r.taskId===t.id).length;
    const sc=data.steps.filter(s=>s.taskId===t.id).length;
    const lc=data.resources.filter(r=>r.taskId===t.id).length;
    html+=`<div class="card card-row" onclick="openTaskFromList('${t.id}')">
      ${ring(t.progress,52)}
      <div style="flex:1;min-width:0">
        <p style="margin:0 0 4px;font-weight:700;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.name)}</p>
        ${statusPill(t.progress)}
        <div style="display:flex;gap:10px;margin-top:5px">
          <span style="font-size:11px;color:var(--text4)">📝 ${rc}</span>
          <span style="font-size:11px;color:var(--text4)">🪜 ${sc}</span>
          <span style="font-size:11px;color:var(--text4)">🔗 ${lc}</span>
        </div>
      </div>
      <button class="btn-del" onclick="event.stopPropagation();delTask('${t.id}')">${TRASH}</button>
    </div>`;
  });
  return html+`</div></div>`;
}

// ── TASK DETAIL ──
function renderTaskDetail(task){
  const research=data.research.filter(r=>r.taskId===task.id);
  const steps=data.steps.filter(s=>s.taskId===task.id).sort((a,b)=>a.order-b.order);
  const resources=data.resources.filter(r=>r.taskId===task.id);
  const sub=data.subcategories.find(s=>s.id===task.subcategoryId);
  const cat=sub?data.categories.find(c=>c.id===sub.categoryId):null;
  const TABS=[['summary','⚡ Summary'],['research','📝 Notes'],['steps','🪜 Process'],['resources','🔗 Links']];

  let html=`<div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
    <div style="padding:12px 20px 0;flex-shrink:0">
      <div class="breadcrumb">
        ${cat?`<span>${esc(cat.name)}</span><span class="bc-sep">›</span>`:''}
        ${sub?`<span>${esc(sub.name)}</span><span class="bc-sep">›</span>`:''}
        <span style="color:var(--text3)">${esc(task.name)}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <button class="btn-back" onclick="goBack()">${BACK}</button>
        <div style="flex:1;min-width:0">
          <p style="margin:0 0 1px;font-weight:700;font-size:15px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(task.name)}</p>
          <p style="margin:0;font-size:11px;color:var(--text4)">Started ${fmtDate(task.createdAt)} · ${daysSince(task.createdAt)}d active</p>
        </div>
        ${statusPill(task.progress)}
      </div>
      <div class="card" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:13px;color:var(--text3)">Progress</span>
          <span style="font-size:18px;font-weight:800;color:var(--accent);font-family:'Syne',sans-serif" id="progVal">${task.progress}%</span>
        </div>
        <input type="range" min="0" max="100" step="5" value="${task.progress}" oninput="document.getElementById('progVal').textContent=this.value+'%';setProgress('${task.id}',parseInt(this.value))"/>
        <div style="display:flex;justify-content:space-between;margin-top:2px">
          <span style="font-size:10px;color:var(--text5)">0%</span><span style="font-size:10px;color:var(--text5)">100%</span>
        </div>
      </div>
      <div class="tab-bar">
        ${TABS.map(([id,label])=>`<button class="tab-btn${taskDetailTab===id?' active':''}" onclick="setDetailTab('${id}')">${label}</button>`).join('')}
      </div>
    </div>
    <div style="flex:1;overflow-y:auto;padding:10px 0 20px">`;

  // ── SUMMARY TAB ──
  if(taskDetailTab==='summary'){
    const hasAny=research.length||steps.length||resources.length;
    if(!hasAny){
      html+=`<div class="empty-state" style="margin:16px">
        <p>Nothing to summarise yet</p>
        <p>Add notes, process steps or links — they'll appear here automatically</p>
      </div>`;
    } else {
      html+=`<div style="padding:4px 0 0">`;
      if(research.length){
        html+=`<div class="summary-section">
          <div class="summary-section-title">📝 Notes&nbsp;<span style="color:var(--text5);font-size:10px;font-weight:400;text-transform:none;letter-spacing:0">(${research.length})</span></div>`;
        [...research].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)).forEach(r=>{
          html+=`<div class="summary-note-item">
            <p style="margin:0 0 4px;font-size:13px;color:var(--text2);line-height:1.6;white-space:pre-wrap">${esc(r.content)}</p>
            <p class="mono" style="margin:0;font-size:10px;color:var(--text4)">${fmtDate(r.timestamp)} · ${fmtTime(r.timestamp)}</p>
          </div>`;
        });
        html+=`</div>`;
      }
      if(steps.length){
        html+=`<div class="summary-section">
          <div class="summary-section-title">🪜 Process Steps&nbsp;<span style="color:var(--text5);font-size:10px;font-weight:400;text-transform:none;letter-spacing:0">(${steps.length})</span></div>`;
        steps.forEach((s,i)=>{
          html+=`<div class="summary-step-item">
            <div class="step-num" style="font-size:11px">${i+1}</div>
            <div style="flex:1">
              <p style="margin:0 0 3px;font-size:13px;color:var(--text2);line-height:1.6;white-space:pre-wrap">${esc(s.content)}</p>
              <p class="mono" style="margin:0;font-size:10px;color:var(--text4)">${fmtDate(s.timestamp)}</p>
            </div>
          </div>`;
        });
        html+=`</div>`;
      }
      if(resources.length){
        html+=`<div class="summary-section">
          <div class="summary-section-title">🔗 Links&nbsp;<span style="color:var(--text5);font-size:10px;font-weight:400;text-transform:none;letter-spacing:0">(${resources.length})</span></div>`;
        resources.forEach(r=>{
          html+=`<div class="summary-link-item">
            <div class="link-icon-wrap" style="width:30px;height:30px;border-radius:8px;flex-shrink:0">${LNKICO}</div>
            <div style="flex:1;min-width:0">
              <a class="res-link" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer" style="font-size:13px">${esc(r.name)}</a>
              ${r.description?`<p style="margin:0;font-size:11px;color:var(--text4)">${esc(r.description)}</p>`:''}
            </div>
          </div>`;
        });
        html+=`</div>`;
      }
      html+=`</div>`;
    }
  }

  // ── NOTES TAB ──
  if(taskDetailTab==='research'){
    html+=`<div style="padding:8px 16px 0">
      <p style="margin:0 0 8px;font-size:12px;color:var(--text4)">Every entry is automatically timestamped</p>
      <textarea class="inp" id="resNote" placeholder="Log your research, ideas or findings..."></textarea>
      <button class="btn-primary" onclick="addResearch()">+ Add Note</button>
    </div>`;
    if(!research.length) html+=`<div class="empty-state" style="margin:16px"><p style="margin:0;color:var(--text4);font-size:13px">No notes yet. Start capturing your research.</p></div>`;
    groupByDate(research).forEach(([dateStr,items])=>{
      html+=`<div class="date-divider"><div class="date-line"></div><span class="date-label">${dateStr}</span><div class="date-line"></div></div>
      <div style="padding:0 16px;display:flex;flex-direction:column;gap:8px">`;
      items.forEach(r=>{
        html+=`<div class="card">
          <div style="display:flex;gap:10px;align-items:flex-start">
            <p style="margin:0 0 6px;font-size:14px;color:var(--text2);line-height:1.6;white-space:pre-wrap;flex:1">${esc(r.content)}</p>
            <button class="btn-del" onclick="delResearch('${r.id}')">${TRASH}</button>
          </div>
          <p class="mono" style="margin:0;font-size:11px;color:var(--text5)">${fmtTime(r.timestamp)}</p>
        </div>`;
      });
      html+=`</div>`;
    });
  }

  // ── PROCESS TAB ──
  if(taskDetailTab==='steps'){
    html+=`<div style="padding:8px 16px 0">
      <p style="margin:0 0 8px;font-size:12px;color:var(--text4)">Build a numbered step-by-step process from your research</p>
      <textarea class="inp" id="stepNote" placeholder="Describe this step in your process..."></textarea>
      <button class="btn-primary" onclick="addStep()">+ Add Step</button>
    </div>`;
    if(!steps.length) html+=`<div class="empty-state" style="margin:16px"><p style="margin:0;color:var(--text4);font-size:13px">No steps yet. Convert your research into an ordered process.</p></div>`;
    html+=`<div style="padding:8px 16px 0;display:flex;flex-direction:column;gap:8px">`;
    steps.forEach((s,i)=>{
      html+=`<div class="card" style="display:flex;gap:12px;align-items:flex-start">
        <div class="step-num">${i+1}</div>
        <div style="flex:1">
          <p style="margin:0 0 5px;font-size:14px;color:var(--text2);line-height:1.6;white-space:pre-wrap">${esc(s.content)}</p>
          <p class="mono" style="margin:0;font-size:11px;color:var(--text5)">${fmtDate(s.timestamp)} · ${fmtTime(s.timestamp)}</p>
        </div>
        <button class="btn-del" onclick="delStep('${s.id}')">${TRASH}</button>
      </div>`;
    });
    html+=`</div>`;
  }

  // ── LINKS TAB ──
  if(taskDetailTab==='resources'){
    html+=`<div style="padding:8px 16px 0">
      <p style="margin:0 0 8px;font-size:12px;color:var(--text4)">Save clickable links to any useful resource</p>
      <div class="card" style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px">
        <input class="inp" id="rName" placeholder="Resource name" style="margin-bottom:0"/>
        <input class="inp" id="rUrl" placeholder="URL (https://...)" style="margin-bottom:0"/>
        <input class="inp" id="rDesc" placeholder="What is this useful for? (optional)" style="margin-bottom:0"/>
      </div>
      <button class="btn-primary" onclick="addResource()">Save Link</button>
    </div>`;
    if(!resources.length) html+=`<div class="empty-state" style="margin:16px"><p style="margin:0;color:var(--text4);font-size:13px">No links saved yet.</p></div>`;
    html+=`<div style="padding:8px 16px 0;display:flex;flex-direction:column;gap:8px">`;
    resources.forEach(r=>{
      html+=`<div class="card" style="display:flex;gap:12px;align-items:flex-start">
        <div class="link-icon-wrap">${LNKICO}</div>
        <div style="flex:1;min-width:0">
          <a class="res-link" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.name)}</a>
          ${r.description?`<p style="margin:0 0 2px;font-size:12px;color:var(--text3)">${esc(r.description)}</p>`:''}
          <p class="mono" style="margin:0 0 2px;font-size:11px;color:var(--text5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.url)}</p>
          <p style="margin:0;font-size:10px;color:var(--text5)">${fmtDate(r.timestamp)}</p>
        </div>
        <button class="btn-del" onclick="delResource('${r.id}')">${TRASH}</button>
      </div>`;
    });
    html+=`</div>`;
  }

  html+=`</div></div>`;
  return html;
}

// ═══════════════════════════════════
//  INIT
// ═══════════════════════════════════
loadTheme();
load();
render();
</script>
</body>
</html>
